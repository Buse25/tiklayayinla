<script>
        // Micro-interaction for password toggle
        const toggleBtn = document.querySelector('button span:contains("visibility")');
        if(toggleBtn) {
            toggleBtn.parentElement.addEventListener('click', () => {
                const input = document.getElementById('password');
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                toggleBtn.textContent = isPassword ? 'visibility_off' : 'visibility';
            });
        }

        // Custom selector helper for the text logic above as :contains isn't standard CSS
        document.querySelectorAll('button').forEach(btn => {
            const span = btn.querySelector('.material-symbols-outlined');
            if (span && span.textContent === 'visibility') {
                btn.addEventListener('click', () => {
                    const input = document.getElementById('password');
                    const isPassword = input.getAttribute('type') === 'password';
                    input.setAttribute('type', isPassword ? 'text' : 'password');
                    span.textContent = isPassword ? 'visibility_off' : 'visibility';
                });
            }
        });
    </script>
