<form class="space-y-sm" id="loginForm">

<input class="w-full pt-6 pb-2 px-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface transition-all" id="email" name="email" placeholder=" " required="" type="email"/>

<input class="w-full pt-6 pb-2 px-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface transition-all" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="floating-label font-label-md text-on-surface-variant" for="password">Şifre</label>
<button class="absolute right-4 top-5 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>

<div class="flex justify-end">

<script>
        // Micro-interaction for password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Handle form submission animation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Disable button and show loading state
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            
            // Artificial delay for UX
            setTimeout(() => {
                alert('SaaS Portalına Yönlendiriliyorsunuz...');
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }, 1500);
        });

        // Atmosphere interaction: Move background blobs based on mouse
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const blobs = document.querySelectorAll('.blur-3xl');
            blobs.forEach((blob, index) => {
                const speed = index === 0 ? 1 : -1.5;
                blob.style.transform = `translate(${moveX * speed}px, ${moveY * speed}px)`;
            });
        });
    </script>
