services:
  postgres:
    image: postgres:16-alpine
    container_name: tiklayayinla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiklayayinla
      POSTGRES_USER: tiklayayinla
      POSTGRES_PASSWORD: tiklayayinla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiklayayinla -d tiklayayinla"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tiklayayinla-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tiklayayinla-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tiklayayinla
      RABBITMQ_DEFAULT_PASS: tiklayayinla
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
